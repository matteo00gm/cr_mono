name: CI

# Fast signal on a PR: formatting, lint, typecheck, tests and the §6.2
# coverage gates. The two jobs run in parallel deliberately — chaining them
# behind `needs` would hide a test failure until a lint failure was fixed,
# costing a round trip to learn something we could have reported at once.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs: a second push to the same branch makes the first
# run's answer worthless. Keyed on the workflow as well as the ref, so this
# never cancels a *different* workflow running against the same commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the tree.
permissions:
  contents: read

env:
  # Keep CI logs free of telemetry notices.
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  # Turbo remote cache. Inert until these exist — an unset secret is an empty
  # string and Turbo falls back to its local cache. Benefits build, typecheck
  # and lint; tests are one root Vitest run with no per-package task to cache.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  verify:
    name: Format, lint, typecheck
    runs-on: ubuntu-latest
    # Target is under two minutes; this is a hang guard, not a budget.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Must precede setup-node: `cache: pnpm` shells out to pnpm to locate
      # the store, so pnpm has to be on PATH before that step runs.
      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Never plain `install` in CI — it can silently update the lockfile,
      # so the run would no longer be testing the dependencies under review.
      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      # One Turbo invocation runs both tasks in parallel and reuses the cache.
      - name: Lint and typecheck
        run: pnpm turbo run lint typecheck

      # Turbo tasks are per-package, so this is the only thing that lints
      # root-level files: vitest.config.ts, eslint.config.js, scripts/.
      - name: Lint root-level configs and scripts
        run: pnpm lint:root

      # Architectural boundaries (P0-09). Separate from lint because these are
      # graph properties across packages, which no per-file linter can see.
      - name: Check architectural boundaries
        run: pnpm boundaries

      # Partial stand-in for P0-12's real acceptance test, which is "zero
      # AWS::EC2::NatGateway in the deployed stack" and needs AWS access. This
      # only catches the way the invariant would actually be lost: someone
      # switching the VPC to managed NAT, at ~$32/month per AZ. Replace it with
      # the deployed-stack assertion once a stage exists.
      - name: Assert no managed NAT Gateway is configured
        run: |
          # Match configuration, not prose: infra/vpc.ts explains at length why
          # managed NAT is avoided, and a bare grep for the word flags that
          # explanation. Anchor on the assignment instead.
          if grep -rnE "(nat|type)[[:space:]]*:[[:space:]]*['\"]managed['\"]" infra/ 2>/dev/null; then
            echo "::error::infra/ configures managed NAT — see P0-12; ~\$32/month per AZ, the largest avoidable cost in the stack"
            exit 1
          fi
          echo "no managed NAT configured."

      # The application must connect as app_rw, never as the RDS master. The
      # master holds rds_superuser, which bypasses RLS outright, so every
      # policy P0-37 writes would be inert in production while the test suite
      # stayed green — the suite connects as app_rw and production would not.
      #
      # Anchored on the parameter being built rather than on the word "master":
      # infra/config.ts explains the distinction at length, and a bare grep for
      # the word flags the explanation. Replace this with the deployed-stack
      # assertion in P0-39 once a stage exists.
      - name: Assert the app database URL is built from app_rw
        run: |
          if ! grep -A3 "'database/url'," infra/config.ts | grep -qE "connectionUrl\('app_rw'"; then
            echo "::error::infra/config.ts must build database/url from app_rw — see P0-21a; the RDS master bypasses RLS, which would make every P0-37 policy inert in production"
            exit 1
          fi
          if ! grep -A3 "'database/master_url'," infra/config.ts | grep -qE "connectionUrl\(database\.username"; then
            echo "::error::infra/config.ts must keep the master credentials on their own parameter — see P0-21a"
            exit 1
          fi
          echo "database/url is built from app_rw; master credentials are on their own path."

      # Better Auth reads NODE_ENV, and AWS Lambda does not set it. Two of its
      # behaviours hang off that, and both fail open-ish rather than closed:
      # rate limiting resolves to `enabled: ?? isProduction`, so every auth
      # endpoint would be unlimited; and `getIP` falls back to 127.0.0.1 for
      # every request, which is worse than no limit — it puts all callers in
      # one shared bucket per path, so one attacker locks out every user.
      #
      # packages/core sets both options explicitly so neither depends on the
      # environment. This guards the third leg: removing the variable is
      # completely silent, and `typecheck:infra` does not run here.
      - name: Assert the API function pins NODE_ENV=production
        run: |
          if ! grep -qE "NODE_ENV: *'production'" infra/api.ts; then
            echo "::error::infra/api.ts must set NODE_ENV=production — see P0-46; Lambda does not set it, and Better Auth then disables auth rate limiting and resolves every caller to 127.0.0.1"
            exit 1
          fi
          echo "NODE_ENV is pinned on the API function."

      # `pnpm add` injects an `allowBuilds:` block of placeholders into
      # pnpm-workspace.yaml on every dependency change. It is dead config —
      # "set this to true or false" is not a boolean, so pnpm ignores it — but
      # it reads as load-bearing, which is exactly what the comment in that
      # file warns against. It reached main once despite being reverted by
      # hand a dozen times, which is the argument for checking instead.
      #
      # The placeholder string is pnpm's own "fill this in" marker and is
      # never a legitimate value, so this cannot false-positive on a real
      # setting.
      - name: Assert no unfilled pnpm allowBuilds placeholders
        run: |
          if grep -q "set this to true or false" pnpm-workspace.yaml; then
            echo "::error::pnpm-workspace.yaml carries an unfilled allowBuilds block. pnpm add injects it; revert the file before committing, or decide each value deliberately"
            exit 1
          fi
          echo "pnpm-workspace.yaml carries no unfilled placeholders."

  test:
    name: Test and coverage gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Guards the P0-02 emit split: tests belong to tsconfig.json (checked)
      # and not to tsconfig.build.json (emitted). Without this the split can
      # regress silently, since nothing else looks inside dist.
      - name: Assert no test artefacts in dist
        run: |
          leaked=$(find apps packages -path '*/dist/*' -name '*.test.*' -not -path '*/node_modules/*')
          if [ -n "$leaked" ]; then
            echo "Test artefacts leaked into build output:"
            echo "$leaked"
            exit 1
          fi
          echo "dist is clean."

      - name: Test with coverage
        run: pnpm test:coverage

      # The §6.2 bars. Vitest applies coverage at the root of a projects run,
      # so per-package thresholds cannot live in Vitest config at all.
      - name: Enforce coverage gates
        run: pnpm coverage:check

  # Real Postgres, via Testcontainers. Separate from `test` and deliberately
  # not behind `needs:` — for the same reason `verify` and `test` run in
  # parallel: chaining would hide an isolation failure behind a lint failure
  # and cost a round trip to learn something we could have reported at once.
  #
  # This was "later" for a long time, and stopped being defensible. The suite
  # is no longer schema shape checks: it carries every RLS isolation
  # assertion, the P0-46 adversarial auth suite, P0-47's proof that `withUser`
  # is bounded by policy, and P0-48's IDOR behavioural test. Those are exactly
  # the assertions that catch a tenant-isolation regression, and none of them
  # ran on a pull request.
  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    # Each of the 30 suite files starts its own container and applies
    # bootstrap plus every migration, so the expected wall clock is a couple of
    # minutes. This is a hang guard, not a budget — if it is ever approached,
    # the fix is the template-database change described in P0-44, not a bigger
    # number here.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Required, not incidental. The suites import `@catalogorosso/testing`,
      # `@catalogorosso/db` and `@catalogorosso/core` by package name, which
      # resolve to `dist` — without a build they fail at import with
      # "Cannot find module", several layers from the cause.
      - name: Build
        run: pnpm build

      # No Docker setup step: `ubuntu-latest` ships with the daemon running,
      # and Testcontainers pulls the image itself. The image is pinned to
      # pgvector/pgvector:0.8.0-pg16 (P0-44) — pinned *low*, so a capability
      # that works here works on the version RDS actually offers.
      #
      # Deliberately not cached. Restoring a ~430 MB image from the Actions
      # cache is not reliably faster than pulling it, and a stale cache entry
      # would silently test the wrong Postgres.
      - name: Integration tests
        run: pnpm test:integration
