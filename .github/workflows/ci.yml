name: CI

# Fast signal on a PR: formatting, lint, typecheck, tests and the §6.2
# coverage gates. The two jobs run in parallel deliberately — chaining them
# behind `needs` would hide a test failure until a lint failure was fixed,
# costing a round trip to learn something we could have reported at once.
on:
  # `edited` as well as the default three, because of P0-61's check. It reads
  # the body from `github.event.pull_request.body`, which is frozen in the event
  # payload — so a PR that fails for a missing `## Why` heading cannot be fixed
  # by writing one. Re-running replays the same stale payload, and the only way
  # back to green is an unrelated push. Three PRs have now been through that.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

# Cancel superseded runs: a second push to the same branch makes the first
# run's answer worthless. Keyed on the workflow as well as the ref, so this
# never cancels a *different* workflow running against the same commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the tree.
permissions:
  contents: read

env:
  # Keep CI logs free of telemetry notices.
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  # Turbo remote cache. Inert until these exist — an unset secret is an empty
  # string and Turbo falls back to its local cache. Benefits build, typecheck
  # and lint; tests are one root Vitest run with no per-package task to cache.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  verify:
    name: Format, lint, typecheck
    runs-on: ubuntu-latest
    # Target is under two minutes; this is a hang guard, not a budget.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Must precede setup-node: `cache: pnpm` shells out to pnpm to locate
      # the store, so pnpm has to be on PATH before that step runs.
      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Never plain `install` in CI — it can silently update the lockfile,
      # so the run would no longer be testing the dependencies under review.
      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      # One Turbo invocation runs both tasks in parallel and reuses the cache.
      - name: Lint and typecheck
        run: pnpm turbo run lint typecheck

      # Turbo tasks are per-package, so this is the only thing that lints
      # root-level files: vitest.config.ts, eslint.config.js, scripts/.
      - name: Lint root-level configs and scripts
        run: pnpm lint:root

      # ADR hygiene (P0-59). Three failures, none visible in any single file:
      # a decision with no status or date, numbering that has drifted, and a
      # supersession pointing at nothing. The last is the worst — it says the
      # decision changed and then refuses to say how.
      #
      # The append-only rule itself is enforced by review and git history; this
      # catches every consequence of breaking it.
      - name: Check ADRs
        run: pnpm adr:check

      # The invariants (P0-60). Packages are discovered on disk rather than
      # listed, the same reflection pattern as P0-41 — so a new package fails
      # this the moment it exists, which is the intended prompt.
      #
      # Every invariant must cite a task id. An unattributed prohibition is one
      # nobody can look up, so it gets followed until it is inconvenient and
      # then quietly dropped.
      - name: Check AGENTS.md
        run: pnpm agents:check

      # A template nobody fills is worse than no template: it manufactures the
      # appearance of process (P0-61). This fails when `## Why` is empty or
      # still holds the placeholder comment.
      #
      # Only on pull_request — a push to main has no PR body to read, and the
      # step would either fail spuriously or have to be written to pass on
      # nothing, which is the same as not running it.
      - name: Check the PR explains why
        if: github.event_name == 'pull_request'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-pr-why.mjs

      # Architectural boundaries (P0-09). Separate from lint because these are
      # graph properties across packages, which no per-file linter can see.
      - name: Check architectural boundaries
        run: pnpm boundaries

      # Partial stand-in for P0-12's real acceptance test, which is "zero
      # AWS::EC2::NatGateway in the deployed stack" and needs AWS access. This
      # only catches the way the invariant would actually be lost: someone
      # switching the VPC to managed NAT, at ~$32/month per AZ. Replace it with
      # the deployed-stack assertion once a stage exists.
      - name: Assert no managed NAT Gateway is configured
        run: |
          # Match configuration, not prose: infra/vpc.ts explains at length why
          # managed NAT is avoided, and a bare grep for the word flags that
          # explanation. Anchor on the assignment instead.
          if grep -rnE "(nat|type)[[:space:]]*:[[:space:]]*['\"]managed['\"]" infra/ 2>/dev/null; then
            echo "::error::infra/ configures managed NAT — see P0-12; ~\$32/month per AZ, the largest avoidable cost in the stack"
            exit 1
          fi
          echo "no managed NAT configured."

      # The application must connect as app_rw, never as the RDS master. The
      # master holds rds_superuser, which bypasses RLS outright, so every
      # policy P0-37 writes would be inert in production while the test suite
      # stayed green — the suite connects as app_rw and production would not.
      #
      # Anchored on the parameter being built rather than on the word "master":
      # infra/config.ts explains the distinction at length, and a bare grep for
      # the word flags the explanation. Replace this with the deployed-stack
      # assertion in P0-39 once a stage exists.
      - name: Assert the app database URL is built from app_rw
        run: |
          if ! grep -A3 "'database/url'," infra/config.ts | grep -qE "connectionUrl\('app_rw'"; then
            echo "::error::infra/config.ts must build database/url from app_rw — see P0-21a; the RDS master bypasses RLS, which would make every P0-37 policy inert in production"
            exit 1
          fi
          if ! grep -A3 "'database/master_url'," infra/config.ts | grep -qE "connectionUrl\(database\.username"; then
            echo "::error::infra/config.ts must keep the master credentials on their own parameter — see P0-21a"
            exit 1
          fi
          echo "database/url is built from app_rw; master credentials are on their own path."

      # Better Auth reads NODE_ENV, and AWS Lambda does not set it. Two of its
      # behaviours hang off that, and both fail open-ish rather than closed:
      # rate limiting resolves to `enabled: ?? isProduction`, so every auth
      # endpoint would be unlimited; and `getIP` falls back to 127.0.0.1 for
      # every request, which is worse than no limit — it puts all callers in
      # one shared bucket per path, so one attacker locks out every user.
      #
      # packages/core sets both options explicitly so neither depends on the
      # environment. This guards the third leg: removing the variable is
      # completely silent, and `typecheck:infra` does not run here.
      # P0-17 recorded this hazard and P0-17a removed it, which is exactly the
      # kind of fix that comes back: `customErrorResponses` is the obvious way
      # to do SPA routing, and every tutorial reaches for it.
      #
      # It is distribution-wide rather than per-behaviour, so with API paths on
      # this distribution it turns every genuine API 404 into a 200 carrying
      # dashboard HTML — silently breaking §3.5's "a cross-tenant id returns
      # 404", in the direction that looks like success. SPA routing is a
      # CloudFront Function scoped to the S3 behaviour instead.
      - name: Assert CloudFront maps no error responses distribution-wide
        run: |
          if grep -qE "^[[:space:]]*customErrorResponses:" infra/cdn.ts; then
            echo "::error::infra/cdn.ts sets customErrorResponses — see P0-17a; it is distribution-wide, so it turns every API 404 into a 200 carrying dashboard HTML. Use a CloudFront Function on the S3 behaviour instead."
            exit 1
          fi
          echo "no distribution-wide error mapping."

      - name: Assert the API function pins NODE_ENV=production
        run: |
          if ! grep -qE "NODE_ENV: *'production'" infra/api.ts; then
            echo "::error::infra/api.ts must set NODE_ENV=production — see P0-46; Lambda does not set it, and Better Auth then disables auth rate limiting and resolves every caller to 127.0.0.1"
            exit 1
          fi
          echo "NODE_ENV is pinned on the API function."

      # Every environment variable the composition root reads must actually be
      # injected. This guard exists because it was not: E9 shipped a wired
      # composition root whose four email variables reached no Lambda, and
      # nothing failed — the code degrades to the log transport, which is the
      # safe direction and therefore silent. `typecheck:infra` is local-only
      # (E3), so a grep is the guard available here.
      - name: Assert the API function receives the email environment
        run: |
          missing=""
          for key in SST_STAGE EMAIL_FROM RESEND_API_KEY EMAIL_ALLOWLIST RESEND_WEBHOOK_SECRET; do
            if ! grep -qE "^[[:space:]]*$key:" infra/api.ts; then
              missing="$missing $key"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::infra/api.ts does not inject:$missing — apps/api/src/composition.ts reads them, and an absent value degrades silently: the log transport for mail (P0-64, E9), and a webhook endpoint that refuses every bounce for RESEND_WEBHOOK_SECRET (P0-64b, E7)"
            exit 1
          fi
          echo "the API function receives the email environment."

      # Both halves of the origin guard (A2). A deploy showed the Function URL
      # is reachable directly, skipping the CloudFront Function that pins the
      # client IP — so CloudFront attaches a secret header and the API refuses
      # anything without it. Dropping either half leaves an API that works
      # perfectly and is quietly reachable around the edge, which is exactly how
      # this went unnoticed the first time.
      - name: Assert the origin guard is wired at both ends
        run: |
          if ! grep -q "customHeaders: \[{ name: 'x-origin-secret'" infra/cdn.ts; then
            echo "::error::infra/cdn.ts must attach the x-origin-secret custom header to the API origin — see A2; without it every request is refused, because the API requires it on a deployed stage"
            exit 1
          fi
          if ! grep -q "ORIGIN_SECRET: originSecret" infra/api.ts; then
            echo "::error::infra/api.ts must pass ORIGIN_SECRET to the function — see A2; src/index.ts refuses to start a deployed stage without it"
            exit 1
          fi
          echo "the origin guard is wired at both ends."

      # Reserved concurrency (B1) and the shared rate-limit store (A1) are
      # coupled: Better Auth's limits are per container, so an unbounded
      # function multiplies every configured limit by however many are warm.
      # Both are silent when wrong — the API works and only the limiter stops
      # meaning what it says.
      - name: Assert the API function caps its concurrency
        run: |
          if ! grep -qE "concurrency: *\{ *reserved: *[0-9]+" infra/api.ts; then
            echo "::error::infra/api.ts must set concurrency.reserved — see B1; each concurrent Lambda holds a Postgres connection and an unbounded function exhausts max_connections on a t4g.micro before hitting its own limit"
            exit 1
          fi
          echo "reserved concurrency is set."

      # The worker's concurrency model, which P1-32 exists to get right and
      # which no test can see: `infra/queue.ts` constructs SST resources at
      # import time, so nothing outside a deploy can load it.
      #
      # Reserved concurrency on an SQS event source does not slow polling — it
      # throttles invocations. SQS keeps delivering, throttled messages return
      # to the queue, **each return increments the receive count**, and past
      # `maxReceiveCount` they land in the DLQ. The result is a dead-letter
      # queue full of perfectly valid products that were never attempted,
      # looking exactly like the embedding failures P1-50 exists to triage.
      #
      # It is the intuitive fix for a backed-up queue, which is why it needs a
      # guard rather than a comment.
      - name: Assert the embedding worker caps concurrency on the mapping
        run: |
          if grep -qE "concurrency: *\{ *reserved:" infra/queue.ts; then
            echo "::error::infra/queue.ts sets reserved concurrency — see P1-32; on an SQS event source that throttles invocations rather than slowing polling, and every throttled return increments the receive count until valid products reach the DLQ unattempted"
            exit 1
          fi
          if ! grep -qE "scalingConfig: *\{" infra/queue.ts || ! grep -qE "maximumConcurrency: *[A-Za-z0-9_.]+," infra/queue.ts; then
            echo "::error::infra/queue.ts must set scalingConfig.maximumConcurrency — see P1-32; an unbounded mapping competes with live widget traffic for the ~100 connections a t4g.micro has"
            exit 1
          fi
          if ! grep -qE "functionResponseTypes: *\['ReportBatchItemFailures'\]" infra/queue.ts; then
            echo "::error::infra/queue.ts must set functionResponseTypes: ['ReportBatchItemFailures'] — see P1-32; without it one malformed message fails the whole batch, so nine wines that embedded successfully are redelivered, re-embedded and paid for again"
            exit 1
          fi
          echo "the worker caps concurrency on the mapping and reports partial failures."

      # The poller is only useful if something invokes it, and a bare
      # `aws.cloudwatch.EventRule` has no target and no invoke permission — it
      # fires happily and calls nothing. The queue then stays empty while
      # CloudWatch shows a healthy rule at a hundred per cent success, which is
      # the failure the whole embedding pipeline exists to remove, one level up.
      # This was written the wrong way first.
      - name: Assert the outbox poller is actually invoked on a schedule
        run: |
          # Anchored on the constructor call, not the name: the comment above it
          # in queue.ts says "sst.aws.Cron rather than a bare EventRule", and a
          # bare grep for the name would be satisfied by that prose while the
          # code did the opposite. Two tests in this repository have already
          # been caught passing on their own explanation.
          if ! grep -qE "new sst\.aws\.Cron\(" infra/queue.ts; then
            echo "::error::infra/queue.ts must schedule the poller with sst.aws.Cron — see P1-32; a bare EventRule has no target and no invoke permission, so it fires and calls nothing while reporting success"
            exit 1
          fi
          if ! grep -qE "EMBEDDING_QUEUE_URL: *[A-Za-z]" infra/queue.ts; then
            echo "::error::infra/queue.ts does not inject EMBEDDING_QUEUE_URL — see P1-31; the poller refuses to start without it, which is the loud failure, but the deploy should not get that far"
            exit 1
          fi
          echo "the poller is scheduled with a target and receives its queue."

      # The SPA reaches the bucket only if `sst.config.ts` imports the module
      # that puts it there. This is the E9 shape exactly: a seam correct on both
      # sides with nothing joining them, and the symptom of the missing import
      # is a distribution that serves the *previous* deploy's files forever
      # while every resource reports success. `typecheck:infra` is local-only
      # (E3), so a grep is the guard available.
      - name: Assert the dashboard build is actually deployed
        run: |
          if ! grep -q "await import('./infra/dashboard')" sst.config.ts; then
            echo "::error::sst.config.ts does not import ./infra/dashboard — the SPA build would never reach the bucket, and the distribution would keep serving the previous deploy with nothing failing (P0-58)"
            exit 1
          fi
          if ! grep -q "cacheControl: asset.cacheControl" infra/dashboard.ts; then
            echo "::error::infra/dashboard.ts does not set cacheControl from the decision in static-assets.ts — an unset header falls to the distribution's 24h defaultTtl, which caches index.html and serves a stale console after every deploy (P0-58)"
            exit 1
          fi
          echo "the dashboard build is wired into the deploy."

      # The notification that a dependency wants to run code at install time.
      #
      # pnpm appends `<package>: set this to true or false` to
      # pnpm-workspace.yaml for any build-script package it has not been told
      # about, and it does this on every *fresh* install — not only on
      # `pnpm add`. So this step runs after `pnpm install` on purpose: it is
      # reading what pnpm just decided, not what a human committed.
      #
      # The four known packages are answered `false` in that file, so a clean
      # run finds nothing. A new one appearing is exactly the event worth
      # stopping a pull request for — somebody has to decide whether it may
      # execute during install, and the placeholder is pnpm asking.
      #
      # The placeholder text is pnpm's own marker and is never a legitimate
      # value, so this cannot false-positive on a real setting.
      - name: Assert no dependency is asking to run build scripts
        run: |
          # Anchored on the injected line shape — indented key, colon, marker —
          # rather than a bare substring, which would also match the comment in
          # pnpm-workspace.yaml that explains this check.
          if grep -qE '^[[:space:]]+[A-Za-z0-9_@/.-]+: set this to true or false[[:space:]]*$' pnpm-workspace.yaml; then
            echo "::error::A dependency wants to run a build script at install time. pnpm has appended it to pnpm-workspace.yaml as an unanswered placeholder — decide whether it may execute, set it to true or false, and commit that."
            grep -nE '^[[:space:]]+[A-Za-z0-9_@/.-]+: set this to true or false[[:space:]]*$' pnpm-workspace.yaml
            exit 1
          fi
          echo "no dependency is asking to run build scripts."

  test:
    name: Test and coverage gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Guards the P0-02 emit split: tests belong to tsconfig.json (checked)
      # and not to tsconfig.build.json (emitted). Without this the split can
      # regress silently, since nothing else looks inside dist.
      - name: Assert no test artefacts in dist
        run: |
          leaked=$(find apps packages -path '*/dist/*' -name '*.test.*' -not -path '*/node_modules/*')
          if [ -n "$leaked" ]; then
            echo "Test artefacts leaked into build output:"
            echo "$leaked"
            exit 1
          fi
          echo "dist is clean."

      # The API reference is generated from the route table, so a difference
      # means the API changed and the reference did not (P0-62). Hand-written
      # API docs are the fastest-rotting artifact in a codebase; this one cannot
      # rot, because CI regenerates it and compares.
      #
      # In the `test` job because it needs `pnpm build` — the generator imports
      # the built application to enumerate routes from the router rather than
      # from a list somebody maintains.
      - name: Check the OpenAPI document is current
        run: pnpm openapi:check

      # The endpoint -> call-site map (P0-63). Derived from the calls
      # themselves, so it cannot fall behind — and complete only because the
      # lint rule forbids raw `fetch` to our own API outside the client.
      - name: Check the API consumer map is current
        run: pnpm consumers:check

      - name: Test with coverage
        run: pnpm test:coverage

      # The §6.2 bars. Vitest applies coverage at the root of a projects run,
      # so per-package thresholds cannot live in Vitest config at all.
      - name: Enforce coverage gates
        run: pnpm coverage:check

  # Real Postgres, via Testcontainers. Separate from `test` and deliberately
  # not behind `needs:` — for the same reason `verify` and `test` run in
  # parallel: chaining would hide an isolation failure behind a lint failure
  # and cost a round trip to learn something we could have reported at once.
  #
  # This was "later" for a long time, and stopped being defensible. The suite
  # is no longer schema shape checks: it carries every RLS isolation
  # assertion, the P0-46 adversarial auth suite, P0-47's proof that `withUser`
  # is bounded by policy, and P0-48's IDOR behavioural test. Those are exactly
  # the assertions that catch a tenant-isolation regression, and none of them
  # ran on a pull request.
  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    # Each of the 30 suite files starts its own container and applies
    # bootstrap plus every migration, so the expected wall clock is a couple of
    # minutes. This is a hang guard, not a budget — if it is ever approached,
    # the fix is the template-database change described in P0-44, not a bigger
    # number here.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Required, not incidental. The suites import `@catalogorosso/testing`,
      # `@catalogorosso/db` and `@catalogorosso/core` by package name, which
      # resolve to `dist` — without a build they fail at import with
      # "Cannot find module", several layers from the cause.
      - name: Build
        run: pnpm build

      # `ubuntu-latest` ships with the daemon running, so there is no Docker
      # setup step. The image is pinned to pgvector/pgvector:0.8.0-pg16 (P0-44)
      # — pinned *low*, so a capability that works here works on the version
      # RDS actually offers.
      #
      # **Pulled once, here, rather than by Testcontainers.** Forty-one suite
      # files start containers across four workers, and each start asks Docker
      # Hub for the manifest. Anonymous pulls are rate-limited per IP and
      # Actions runners share IPs, so on a bad morning the registry answers a
      # 500 or resets the connection and unrelated suites fail with
      # `read: connection reset by peer`. That is what broke `main` after #108,
      # with nothing wrong in the tree.
      #
      # One pull puts both images in the local daemon and every container start
      # after it is a cache hit. Still not the Actions *cache*: restoring ~430 MB
      # is not reliably faster than pulling it, and a stale entry would silently
      # test the wrong Postgres.
      #
      # Retried because the failure being worked around is transient by
      # definition — a single attempt here would just move the flake one step
      # earlier. Backoff rather than three immediate tries, since the thing
      # being waited out is a rate limit.
      - name: Pull the container images
        run: |
          pull() {
            for attempt in 1 2 3 4; do
              if docker pull --quiet "$1"; then
                return 0
              fi
              echo "::warning::pull of $1 failed (attempt $attempt); retrying"
              sleep $((attempt * 15))
            done
            echo "::error::could not pull $1 after four attempts — Docker Hub is refusing, which is a registry problem rather than a change in this pull request"
            return 1
          }

          # The Postgres image. Failing here is correct: without it every suite
          # fails anyway, and one clear message beats forty confusing ones.
          pull pgvector/pgvector:0.8.0-pg16

          # Testcontainers' reaper, whose manifest request is the one that
          # actually failed on the run that prompted this step.
          #
          # Its tag is read out of the installed package rather than written
          # here, because it belongs to Testcontainers and moves on upgrade — a
          # hard-coded tag would turn a routine dependency bump into a CI
          # failure about an image nobody changed.
          #
          # Best-effort on purpose. If the tag cannot be found, or the pull
          # fails, Testcontainers still fetches it itself: that is the status
          # quo, which is worth a warning and not a red build.
          ryuk=$(grep -rhoE 'testcontainers/ryuk:[0-9.]+' node_modules/.pnpm/testcontainers@*/node_modules/testcontainers/build/reaper/reaper.js 2>/dev/null | head -1)
          if [ -n "$ryuk" ]; then
            pull "$ryuk" || echo "::warning::could not pre-pull $ryuk; Testcontainers will fetch it"
          else
            echo "::warning::could not find the ryuk tag in node_modules; skipping its pre-pull"
          fi

      # The image tag lives in two files — `packages/testing` for the suites
      # that use the shared harness, `packages/db/test/support` for the ones
      # that predate it — and the step above pulls a third copy of the string.
      # Three places that must agree, and disagreeing is silent: the pull warms
      # one image and the tests download another, which is the flake this step
      # exists to remove, wearing a disguise.
      - name: Assert the pulled image is the one the suites ask for
        run: |
          for file in packages/testing/src/db-harness.ts packages/db/test/support/postgres.ts; do
            if ! grep -q "pgvector/pgvector:0.8.0-pg16" "$file"; then
              echo "::error::$file no longer pins pgvector/pgvector:0.8.0-pg16 — update the pull step above, or it warms an image the suites never use"
              exit 1
            fi
          done
          echo "the pulled image matches what the suites start."

      - name: Integration tests
        run: pnpm test:integration
