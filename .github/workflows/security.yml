name: Security

# Separate from ci.yml because these gates answer a different question and run
# on a different trigger: a new advisory can appear with no code change at all,
# so this also runs on a schedule.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily. Dependency advisories are published independently of our commits;
    # a scan that only runs on push would find them whenever we next happened
    # to touch the repo.
    - cron: '17 6 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned tool versions with verified checksums. Both are Go binaries fetched
  # from their release pages rather than run as third-party actions: no
  # licensing coupling, and the checksum is the supply-chain control.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  OSV_VERSION: 2.5.1
  OSV_SHA256: f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Load-bearing. The default shallow clone has exactly one commit, so
          # a full-history scan against it would pass while checking nothing.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks.tar.gz gitleaks
          gitleaks version

      # A secret scanner that silently stops matching is indistinguishable from
      # a clean repository. These two steps assert the custom rules still fire
      # on every run, so the gate cannot rot into a no-op.
      - name: Prove the sk_live_ rule fires
        run: |
          d="$RUNNER_TEMP/leaktest"
          mkdir -p "$d"
          # Assembled at runtime. A literal key-shaped string written into this
          # workflow file would be found by the history scan below — which is
          # the trap the plan warns about, the scanner flagging itself.
          printf 'const key = "sk_live_%s";' "$(openssl rand -hex 16)" > "$d/fixture.ts"
          if gitleaks dir "$d" --config .gitleaks.toml --redact --no-banner; then
            echo "::error::the sk_live_ rule did not fire; the secret gate is decoration"
            exit 1
          fi
          echo "custom rule fired as expected"

      - name: Prove it does not fire on ordinary code
        run: |
          d="$RUNNER_TEMP/cleantest"
          mkdir -p "$d"
          printf 'export const price = 12.5;' > "$d/clean.ts"
          gitleaks dir "$d" --config .gitleaks.toml --redact --no-banner

      # --redact keeps any finding out of the log. Without it the gate reports
      # the leak by printing it into a public build log.
      - name: Scan full history
        run: gitleaks git . --redact --no-banner --log-opts=--all

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The blocking gate: high and critical fail unless there is an
      # allowlist entry with a reason and an expiry inside the 90-day cap.
      - name: Audit with expiring allowlist
        run: pnpm audit:check

      - name: Install osv-scanner
        run: |
          url="https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          curl -sSfL "$url" -o osv-scanner
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          sudo install -m 0755 osv-scanner /usr/local/bin/osv-scanner
          rm -f osv-scanner
          osv-scanner --version

      # Informational, deliberately. `osv-scanner scan` has no severity
      # threshold — --min-severity belongs to `osv-scanner fix` — so blocking
      # on it would fail the build on low-severity findings and contradict the
      # high/critical policy the step above enforces. An inconsistent gate is
      # the kind that gets deleted, so this one reports and pnpm audit blocks.
      # Make it blocking once its output is filtered by severity.
      - name: OSV scan (informational, does not block)
        continue-on-error: true
        run: osv-scanner scan source --lockfile pnpm-lock.yaml
